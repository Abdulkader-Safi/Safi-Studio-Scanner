<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A link fixture with duplicates and mixed rel attributes</title>
</head>
<body>
  <h1>Links</h1>
  <nav>
    <a href="/pricing">Pricing</a>
    <a href="/about">About</a>
  </nav>
  <p>
    See our <a href="/pricing">pricing page</a> or read
    <a href="/pricing">the plans</a>.
  </p>
  <p>
    <a href="https://partner.example.org/deal" rel="nofollow sponsored">Partner offer</a>
    <a href="https://other.example.net/ref" rel="noopener">Reference</a>
    <a href="https://partner.example.org/deal" rel="nofollow">Partner offer</a>
  </p>
  <a href="/about">About</a>
</body>
</html>
