<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>An article with dates and some hidden furniture inside</title>
  <meta name="description" content="A fixture page carrying a published date in a meta tag and a modified date in JSON-LD, so both date sources get exercised.">
  <meta property="article:published_time" content="2026-01-15T09:00:00Z">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Article","headline":"Dated","author":{"@type":"Person","name":"A Writer"},"dateModified":"2026-03-02"}
  </script>
</head>
<body>
  <h1>An article with dates</h1>
  <p>Body copy that exists so the page is not empty when a rule looks at it.</p>
  <div style="display: none">A drawer of markup nobody sees.</div>
  <span hidden>Also hidden.</span>
</body>
</html>
